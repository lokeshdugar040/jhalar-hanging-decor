[build]
  publish = "/"
  command = ""

# NOTE: No catch-all redirect here — Netlify automatically serves 404.html
# for missing URLs, which is correct for a static brochure site.

# ---------- Security headers ----------
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://unpkg.com https://identity.netlify.com https://www.googletagmanager.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://www.google-analytics.com https://analytics.google.com; connect-src 'self' https://api.netlify.com https://www.google-analytics.com https://analytics.google.com; frame-src https://app.netlify.com; upgrade-insecure-requests"

# ---------- Caching ----------
# Product images / static assets: immutable, 1 year
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Product data: short cache so CMS edits appear quickly
[[headers]]
  for = "/content/*"
  [headers.values]
    Cache-Control = "public, max-age=300, must-revalidate"

# HTML: always revalidate
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
