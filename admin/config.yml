# Decap CMS configuration for JHALAR Hanging Decor
#
# This config edits `content/products.json` DIRECTLY — the same file the
# website renders. Anything you publish in the CMS appears on the site
# (the page re-fetches products.json; cache expires within 5 minutes).
#
# Requirements (one-time, in Netlify dashboard):
#   1. Enable "Identity" for the site (Site settings → Identity)
#   2. Enable Git Gateway (Identity → Services → Git Gateway)
#   3. Invite yourself as a user (Identity → Invite users)

backend:
  name: git-gateway
  branch: main

media_folder: "assets/images/products"
public_folder: "/assets/images/products"

site_url: https://jhalarhangingdecor.com
logo_url: /admin/logo-jhalar-02.svg

collections:
  - name: "products"
    label: "Products"
    label_singular: "Product"
    description: "Edit the product collection shown on the website. Changes go live after publishing."
    files:
      - name: "products_data"
        label: "Product Catalogue"
        file: "content/products.json"
        format: "json"
        fields:
          - label: "Products"
            name: "products"
            widget: "list"
            fields:
              - { label: "Title", name: "title", widget: "string", hint: "Product name shown on the card and in Google" }
              - { label: "Category", name: "category", widget: "select", options: ["Floral Jhalars", "Pom Pom Hangings", "Bead Hangings", "Bell Hangings", "Torans", "Tassel Hangings", "Decorative Strings", "Custom Designs"] }
              - { label: "Description", name: "description", widget: "text", hint: "1–2 sentences: what it is + which buyers it suits" }
              - { label: "Image", name: "image", widget: "image", hint: "Upload the WebP (or JPG) product photo" }
              - { label: "B2B Tag", name: "b2bTag", widget: "select", options: ["Bestseller", "Bulk Ready", "Custom Colours", "Event Favourite", "Wholesale Popular", "Premium", "Traditional", "Low MOQ", "New Range"], default: "Bulk Ready" }
  - name: "settings"
    label: "Site Info"
    files:
      - name: "updated"
        label: "Catalogue Note"
        file: "content/products.json"
        format: "json"
        fields:
          - { label: "Last updated", name: "updated", widget: "string", required: false }
