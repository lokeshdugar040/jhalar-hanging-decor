<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found | JHALAR Hanging Decor</title>
    <meta name="robots" content="noindex">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="stylesheet" href="/style.css">
    <style>
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 2rem;
        }
        .error-container { max-width: 560px; }
        .error-code {
            font-family: var(--font-primary);
            font-size: clamp(4rem, 12vw, 6rem);
            color: var(--colour-jhalar-red);
            line-height: 1;
            margin-bottom: 0.5rem;
        }
        .error-container h1 { font-size: 1.5rem; margin-bottom: 0.75rem; }
        .error-container p { font-size: 1.02rem; margin-bottom: 1.75rem; }
        .error-actions { display: flex; gap: 0.75rem; justify-content: center; flex-wrap: wrap; }
        .error-hint { margin-top: 1.5rem; font-size: 0.85rem; color: var(--colour-text-light); }
    </style>
</head>
<body>
    <div class="error-container">
        <div class="error-code">404</div>
        <h1>This garland isn't in our catalogue</h1>
        <p>The page you're looking for doesn't exist — but our collection of handcrafted jhalars and garlands does.</p>
        <div class="error-actions">
            <a href="/" class="btn btn-primary">Back to Home</a>
            <a href="/#collection" class="btn btn-outline">Browse the Collection</a>
        </div>
        <p class="error-hint">Looking for bulk pricing? WhatsApp us at +91 XXXXX XXXXX.</p>
    </div>
</body>
</html>
